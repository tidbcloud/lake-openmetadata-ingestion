# Local OpenMetadata for E2E testing: official OM compose (om-official.yml, hardened local-demo copy of
# https://github.com/open-metadata/OpenMetadata/blob/main/docker/docker-compose-quickstart/docker-compose.yml,
# Apache-2.0) + this override.
# Usage:  docker compose -p lakeom -f om-official.yml -f override.yml up -d
# Container names / host ports are changed so this can coexist with an OM dev checkout. The Airflow
# ingestion container is dropped (this project pushes over REST and never uses OM pipelines).
# TiDB Cloud Lake itself is a managed service: point config.yaml at your Lake cluster; nothing runs here.
services:
  mysql:
    container_name: lakeom_mysql
    ports: !override []
    volumes: !override
      - lakeom-db-data:/var/lib/mysql
      - ./zz-secure-credentials.sh:/docker-entrypoint-initdb.d/zz-secure-credentials.sh:ro

  elasticsearch:
    container_name: lakeom_elasticsearch
    ports: !override []

  # Copy owner-only host keys into an owner-only volume for the image's user.
  # This one-shot local-demo step needs no network access.
  jwt-key-init:
    image: ${OPENMETADATA_SERVER_IMAGE:-docker.getcollate.io/openmetadata/server:2.0.0}
    user: root
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        cp /source/private_key.der /keys/private_key.der
        cp /source/public_key.der /keys/public_key.der
        chown openmetadata:openmetadata /keys /keys/private_key.der /keys/public_key.der
        chmod 700 /keys
        chmod 600 /keys/private_key.der /keys/public_key.der
    volumes:
      - ./jwt-keys:/source:ro
      - lakeom-jwt-keys:/keys

  execute-migrate-all:
    container_name: lakeom_migrate
    volumes:
      - lakeom-jwt-keys:/opt/openmetadata/jwt:ro
    depends_on:
      jwt-key-init:
        condition: service_completed_successfully

  openmetadata-server:
    container_name: lakeom_server
    volumes:
      - lakeom-jwt-keys:/opt/openmetadata/jwt:ro
    depends_on:
      jwt-key-init:
        condition: service_completed_successfully

  ingestion:
    profiles: ["disabled"]

volumes:
  lakeom-db-data:
  lakeom-jwt-keys:

networks:
  app_net:
    ipam: !override
      driver: default
