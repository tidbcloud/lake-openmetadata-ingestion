[project]
name = "lake-openmetadata-ingestion"
version = "0.1.0"
description = "Sync TiDB Cloud Lake metadata and lineage (system_history.lineage_history) into OpenMetadata via REST"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "TiDB Cloud Authors"}]
keywords = ["tidb-cloud-lake", "lake", "openmetadata", "lineage", "metadata"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
requires-python = ">=3.10"
dependencies = [
    "tidbcloudlake-driver>=0.34",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lake-om = "lake_openmetadata_ingestion.cli:main"
lake-openmetadata-ingestion = "lake_openmetadata_ingestion.cli:main"

[project.urls]
Homepage = "https://github.com/tidbcloud/lake-openmetadata-ingestion"
Issues = "https://github.com/tidbcloud/lake-openmetadata-ingestion/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lake_openmetadata_ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
